[project]
name = "ad-creativity-backend"
version = "0.1.0"
description = "FastAPI backend for the AD Creativity platform."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
    "pydantic>=2.11.0,<3.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "pymysql>=1.1.0,<2.0.0",
    "tos>=2.8.0,<3.0.0",
    "httpx>=0.28.0,<1.0.0",
    "byteplus-python-sdk-v2[ark]",
    "sniffio>=1.3.0,<2.0.0",
    "Pillow>=11.0.0,<13.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "pytest>=8.0.0,<9.0.0",
]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
